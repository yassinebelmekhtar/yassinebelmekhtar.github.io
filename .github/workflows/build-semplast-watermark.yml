name: Build SEHIMPLAST watermarked site

on:
  push:
    branches:
      - semplast-watermark
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Install image tools
        run: sudo apt-get update && sudo apt-get install -y imagemagick wget zip python3-pil

      - name: Download the public website
        run: |
          rm -rf semplast-site .site-download
          mkdir -p semplast-site
          wget --mirror --page-requisites --convert-links --adjust-extension \
            --no-parent --execute robots=off \
            https://semplast.netlify.app/ -P .site-download
          cp -a .site-download/semplast.netlify.app/. semplast-site/
          test -f semplast-site/index.html
          test -f semplast-site/catalog/model-01.webp
          test -f semplast-assets/sehimplast-logo-watermark.png
          cp semplast-assets/sehimplast-logo-watermark.png new-logo.png

      - name: Apply SEHIMPLAST identity
        shell: bash
        run: |
          set -euo pipefail
          find semplast-site -type f -name '*.html' -print0 | xargs -0 sed -i \
            -e 's/SEMPLAST SARL AU/SEHIMPLAST SARL AU/g' \
            -e 's/SEMPLAST/SEHIMPLAST/g' \
            -e 's/Semplast/Sehimplast/g'
          printf '%s\n' 'Company identity updated in all HTML pages'

      - name: Replace product watermarks
        shell: bash
        run: |
          set -euo pipefail
          convert new-logo.png -trim +repage -strip logo-trimmed.png
          convert new-logo.png -background white -alpha remove -alpha off \
            -resize 540x372 -gravity center -extent 576x408 \
            -strip -quality 90 semplast-site/semplast-logo.jpeg

          mapfile -t images < <(
            find semplast-site/catalog -maxdepth 1 -type f \( -iname 'model-*.webp' -o -iname 'model-*.png' -o -iname 'model-*.jpg' -o -iname 'model-*.jpeg' \) -print
            find semplast-site/products -maxdepth 1 -type f \( -iname '*.webp' -o -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' \) -print
          )

          count=0
          repaired=0
          for img in "${images[@]}"; do
            if ! identify "$img" >/dev/null 2>&1; then
              python3 -c 'from PIL import Image, ImageFile; from pathlib import Path; import os, sys; ImageFile.LOAD_TRUNCATED_IMAGES=True; p=Path(sys.argv[1]); im=Image.open(p); fmt=im.format or p.suffix.lstrip(".").upper(); im.load(); im=im.convert("RGB") if fmt=="JPEG" else im; t=p.with_name(p.stem+".repaired"+p.suffix); im.save(t, format=fmt); im.close(); os.replace(t, p)' "$img"
              repaired=$((repaired + 1))
            fi

            identify "$img" >/dev/null
            width=$(identify -format '%w' "$img")
            mark_width=$(( width * 24 / 100 ))
            pad=$(( width * 12 / 1000 ))
            margin=$(( width * 24 / 1000 ))
            [ "$pad" -lt 8 ] && pad=8
            [ "$margin" -lt 14 ] && margin=14
            ext="${img##*.}"
            tmp="${img%.*}.watermarked.${ext}"

            convert "$img" \
              \( logo-trimmed.png -resize "${mark_width}x" -bordercolor white -border "$pad" \) \
              -gravity southeast -geometry "+${margin}+${margin}" -composite \
              -strip -quality 88 "$tmp"
            mv "$tmp" "$img"
            count=$((count + 1))
          done

          echo "Updated $count product images; repaired $repaired source images"
          test "$count" -ge 20

      - name: Create preview and Netlify ZIP
        run: |
          montage semplast-site/catalog/model-* \
            -thumbnail 180x180 -tile 5x4 -geometry +8+8 \
            -background '#eef3f4' -quality 82 watermark-preview.jpg
          (
            cd semplast-site
            zip -qr ../sehimplast-netlify-watermark.zip .
          )
          unzip -tq sehimplast-netlify-watermark.zip
          test "$(unzip -Z1 sehimplast-netlify-watermark.zip | head -n 1)" != "semplast-site/"

      - name: Save generated files on the branch
        run: |
          git config user.name "SEHIMPLAST Site Builder"
          git config user.email "actions@users.noreply.github.com"
          git add semplast-site watermark-preview.jpg sehimplast-netlify-watermark.zip
          git commit -m "Add SEHIMPLAST watermark to all product images"
          git push origin semplast-watermark
